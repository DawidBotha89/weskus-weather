name: Collector checks
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['data/latest.json', 'data/verification.json', 'data/candidate-verification.json', 'data/estuary-verification.json']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -p '*test*.py'
