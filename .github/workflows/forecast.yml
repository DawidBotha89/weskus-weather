name: Refresh West Coast forecast
on:
  schedule:
    - cron: '24 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weather-publication
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoders
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check units and verification rules
        run: python -m unittest discover -p '*test*.py'
      - name: Refresh data
        id: collect
        continue-on-error: true
        run: python -u update.py
      - name: Publish available readings and verification ledger
        if: hashFiles('data/latest.json') != ''
        run: |
          git add -- data/latest.json data/verification.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Refresh public town weather and verification"
            git push origin HEAD:main
          fi
      - name: Surface a source failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
